<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World Parallax</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .layer {
      position: absolute;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      user-select: none;
    }

    .layer-1 { font-size: 9rem;   color: rgba(99,  102, 241, 0.15); }
    .layer-2 { font-size: 7rem;   color: rgba(139,  92, 246, 0.25); }
    .layer-3 { font-size: 5rem;   color: rgba(168,  85, 247, 0.45); }
    .layer-4 { font-size: 3.5rem; color: rgba(217,  70, 239, 0.70); }
    .layer-5 { font-size: 2rem;   color: rgba(255, 255, 255, 0.95); }

    .subtitle {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.3);
      font-size: 0.85rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="layer layer-1" id="l1">Hello World</div>
  <div class="layer layer-2" id="l2">Hello World</div>
  <div class="layer layer-3" id="l3">Hello World</div>
  <div class="layer layer-4" id="l4">Hello World</div>
  <div class="layer layer-5" id="l5">Hello World</div>
  <p class="subtitle">Move your mouse</p>

  <script>
    const layers = [
      { el: document.getElementById('l1'), depth: 0.06 },
      { el: document.getElementById('l2'), depth: 0.12 },
      { el: document.getElementById('l3'), depth: 0.20 },
      { el: document.getElementById('l4'), depth: 0.32 },
      { el: document.getElementById('l5'), depth: 0.50 },
    ];

    window.addEventListener('mousemove', (e) => {
      const cx = window.innerWidth  / 2;
      const cy = window.innerHeight / 2;
      const dx = e.clientX - cx;
      const dy = e.clientY - cy;

      layers.forEach(({ el, depth }) => {
        el.style.transform = `translate(${dx * depth}px, ${dy * depth}px)`;
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Norsk Trener 🇳🇴</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;padding:0;">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;

    // ─── Storage helpers (localStorage) ───
    const STORAGE_KEY = "norsk-trener-progress";
    const API_KEY_KEY = "norsk-trener-api-key";

    async function loadProgress() {
      try {
        const val = localStorage.getItem(STORAGE_KEY);
        return val ? JSON.parse(val) : null;
      } catch { return null; }
    }

    async function saveProgress(data) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
      catch (e) { console.error("Save failed:", e); }
    }

    function defaultProgress() {
      return {
        level: null, sessionsCompleted: 0, totalMessages: 0,
        topicsCompleted: [], weakAreas: ["passive_s","passive_bli","passive_faa","conditional","modal_burde_skulle","modal_kunne"],
        strongAreas: [], vocabLearned: 0, lastSessionDate: null, streakDays: 0, placementDone: false,
      };
    }

    // ─── Modes & Topics ───
    const MODES = [
      { id: "samtale",    label: "Samtale",     sublabel: "Conversation", icon: "💬" },
      { id: "grammatikk", label: "Grammatikk",  sublabel: "Grammar",      icon: "📐" },
      { id: "ordforråd",  label: "Ordforråd",   sublabel: "Vocabulary",   icon: "📚" },
      { id: "norskprøve", label: "Norskprøve",  sublabel: "Test Prep",    icon: "🎯" },
    ];

    const SAMTALE_SCENARIOS = [
      "At the grocery store","At the doctor's office","Ordering at a café",
      "Asking for directions","Job interview small talk","Chatting with a colleague",
      "At the post office","Calling a plumber/electrician","Parent-teacher meeting",
      "Making plans with a friend","Complaining about a service","At the bank",
    ];

    const GRAMMAR_TOPICS = [
      { label: "🔴 S-passive (dørene lukkes)",       id: "passive_s",           priority: true },
      { label: "🔴 Bli-passive (bilen blir vasket)",  id: "passive_bli",         priority: true },
      { label: "🔴 Få-passive (han fikk døren malt)", id: "passive_faa",         priority: true },
      { label: "🔴 Conditional (hvis jeg hadde...)",  id: "conditional",         priority: true },
      { label: "🔴 Burde/skulle (should)",            id: "modal_burde_skulle",  priority: true },
      { label: "🔴 Kunne (could/can)",                id: "modal_kunne",         priority: true },
      { label: "Word order (V2 rule)",                id: "v2_rule" },
      { label: "Past tense (preteritum)",             id: "past_tense" },
      { label: "Present perfect (har + partisipp)",   id: "present_perfect" },
      { label: "Subordinate clauses (at/fordi/når)",  id: "subordinate" },
      { label: "Adjective agreement",                 id: "adjective" },
      { label: "Comparison (komparativ/superlativ)",  id: "comparison" },
      { label: "Prepositions (i/på/til)",             id: "prepositions" },
    ];

    const VOCAB_TOPICS = [
      "Work & office","Health & body","Food & cooking","Weather & nature",
      "Housing & moving","Transport & travel","Family & relationships",
      "Money & banking","Government & society","Emotions & opinions",
    ];

    // ─── System prompts ───
    function getSystemPrompt(mode, topic, progress) {
      const lvl = progress?.level || "A2";
      const base = `You are a Norwegian language tutor. The learner is a native German speaker at ${lvl} level, aiming for B1 to pass Norskprøve for Norwegian citizenship. They need practical Norwegian for daily life and office.

LEARNER PROFILE:
- Native German speaker (can leverage Germanic similarities)
- Strong at: simple declarative sentences, basic vocabulary
- Weak at: passive voice (all 3 forms: s-passive, bli-passive, få-passive), conditional/subjunctive, modal verbs (burde/skulle/kunne)
- Sessions completed: ${progress?.sessionsCompleted || 0}
- Vocabulary learned: ~${progress?.vocabLearned || 0} words

CRITICAL RULES:
- Respond in Norwegian (Bokmål) first, then brief English explanation.
- Level-appropriate: ${lvl === "A1" ? "very simple sentences, basic present tense" : lvl === "A2" ? "simple sentences, mix in target grammar gently" : "push toward complex sentences, expect more accuracy"}.
- Correct mistakes clearly: show wrong → right, explain briefly in English.
- When relevant, draw parallels to German (e.g. "Like German Konjunktiv II, Norwegian uses...").
- Keep responses concise (3-6 sentences).
- Weave in the learner's weak areas naturally when possible.`;

      if (mode === "placement") {
        return `${base}

MODE: Placement Test
You are assessing the learner's Norwegian level. Ask 6 questions that progressively test:
1. Basic greeting/introduction (A1)
2. Describe daily routine (A1-A2)
3. Talk about a past experience (A2)
4. Express an opinion with "fordi" (A2-B1)
5. Use a conditional sentence (B1)
6. Describe something using passive voice (B1-B2)

Ask ONE question at a time. After the learner responds, briefly note their level for that answer (don't dwell on it), then ask the next. After all 6, give a final assessment: A1, A2, or B1, with a brief summary of strengths and areas to work on.

Start with question 1 now.`;
      }

      if (mode === "samtale") {
        return `${base}

MODE: Conversation Practice
SCENARIO: ${topic}
Role-play this scenario naturally. After each exchange:
1. Respond in character (Norwegian)
2. Correct any errors
3. Suggest a natural follow-up

Occasionally work in situations where the learner needs passive voice, conditionals, or modal verbs (burde/skulle/kunne) — these are their weak spots.`;
      }

      if (mode === "grammatikk") {
        return `${base}

MODE: Grammar Drill
TOPIC: ${topic}
${topic.includes("passive") || topic.includes("Passive") ? `
PASSIVE VOICE FOCUS:
Norwegian has 3 passive forms the learner needs to master:
1. S-passive: verb + s (dørene lukkes, boken leses). Used for general/habitual actions and rules.
2. Bli-passive: bli + past participle (bilen blir vasket). Used for specific actions/events.
3. Få-passive: få + object + past participle (han fikk døren malt). Used when someone has something done for them.
Compare to German: "Das Buch wird gelesen" ≈ "Boken blir lest" (bli-passive). S-passive has no direct German equivalent.
Give exercises that contrast these forms. Make the learner choose the right passive type.` : ""}
${topic.includes("onditional") ? `
CONDITIONAL FOCUS:
- Present conditional: Hvis + present, present/future ("Hvis det regner, blir vi hjemme")
- Past conditional: Hvis + had (preteritum), ville + infinitive ("Hvis jeg hadde tid, ville jeg reise")
- Unreal past: Hvis + hadde + past participle, ville + ha + past participle
Compare to German Konjunktiv II: "Wenn ich Zeit hätte, würde ich reisen" = "Hvis jeg hadde tid, ville jeg reise"` : ""}
${topic.includes("urde") || topic.includes("kulle") || topic.includes("unne") ? `
MODAL VERB FOCUS:
- Burde (should/ought to) — advice: "Du burde sove mer"
- Skulle (should/shall/was going to) — obligation/plan: "Jeg skal gjøre det"
- Kunne (could/can) — ability/possibility: "Jeg kunne gjøre det"` : ""}

Present one exercise at a time. Explain the rule, give a fill-in or transformation exercise, wait for the answer, correct, then give another.`;
      }

      if (mode === "ordforråd") {
        return `${base}

MODE: Vocabulary Building
TOPIC: ${topic}
Teach through context:
1. Present 3-4 words with example sentences
2. Include at least one false friend with German (e.g. "gift" = married in Norwegian, poison in German)
3. Ask the learner to use one in a sentence
4. Correct and expand with collocations
Point out German cognates when helpful.`;
      }

      if (mode === "norskprøve") {
        return `${base}

MODE: Norskprøve B1 Test Preparation
Simulate real test exercises, rotating between:
- Reading comprehension (short text + questions)
- Written production (email/letter prompts typical of B1 exam)
- Oral exam practice (discussion topics, expressing opinions)
Focus especially on passive constructions, conditionals, and modal verbs.`;
      }

      return base;
    }

    // ─── API key setup screen ───
    function ApiKeySetup({ onSave }) {
      const [key, setKey] = useState("");
      return (
        <div style={{ minHeight: "100vh", background: "#faf9f7", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
          <div style={{ maxWidth: 420, width: "100%", background: "#fff", borderRadius: 20, padding: 32, boxShadow: "0 4px 24px rgba(0,0,0,0.08)" }}>
            <div style={{ fontSize: 40, textAlign: "center", marginBottom: 12 }}>🇳🇴</div>
            <h1 style={{ margin: "0 0 6px", fontFamily: "'DM Serif Display', serif", fontWeight: 400, fontSize: 26, textAlign: "center", color: "#1a3a5c" }}>Norsk Trener</h1>
            <p style={{ margin: "0 0 24px", color: "#888", fontSize: 13, textAlign: "center" }}>Enter your Anthropic API key to get started</p>
            <input
              type="password"
              value={key}
              onChange={(e) => setKey(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && key.startsWith("sk-") && onSave(key)}
              placeholder="sk-ant-..."
              style={{
                width: "100%", padding: "12px 16px", borderRadius: 12, border: "1.5px solid #d4d0ca",
                fontSize: 14, fontFamily: "'DM Sans', sans-serif", outline: "none",
                boxSizing: "border-box", marginBottom: 12,
              }}
            />
            <button
              onClick={() => onSave(key)}
              disabled={!key.startsWith("sk-")}
              style={{
                width: "100%", padding: 14, borderRadius: 12, border: "none",
                background: key.startsWith("sk-") ? "#1a3a5c" : "#d4d0ca",
                color: "#fff", fontSize: 15, fontFamily: "'DM Sans', sans-serif",
                fontWeight: 600, cursor: key.startsWith("sk-") ? "pointer" : "default",
              }}
            >
              Start Learning
            </button>
            <p style={{ margin: "16px 0 0", color: "#aaa", fontSize: 11, textAlign: "center" }}>
              Your key is stored only in your browser's localStorage and never sent anywhere except Anthropic's API.
            </p>
          </div>
        </div>
      );
    }

    // ─── Components ───
    function ModeCard({ mode, onClick }) {
      return (
        <button onClick={onClick} style={{
          display: "flex", flexDirection: "column", alignItems: "center", gap: 6,
          padding: "16px 12px", border: "2px solid #e2e0dc", borderRadius: 14,
          background: "#faf9f7", color: "#2c2c2c", cursor: "pointer",
          transition: "all 0.2s ease", flex: 1, minWidth: 0,
        }}>
          <span style={{ fontSize: 22 }}>{mode.icon}</span>
          <span style={{ fontSize: 13, fontWeight: 600, fontFamily: "'DM Sans', sans-serif" }}>{mode.label}</span>
          <span style={{ fontSize: 10, opacity: 0.7, fontFamily: "'DM Sans', sans-serif" }}>{mode.sublabel}</span>
        </button>
      );
    }

    function TopicPicker({ topics, onSelect, completedTopics }) {
      const isGrammar = topics.length > 0 && typeof topics[0] === "object";
      return (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, padding: "12px 0" }}>
          {topics.map((t) => {
            const label = isGrammar ? t.label : t;
            const id    = isGrammar ? t.id    : t;
            const done  = completedTopics?.includes(id);
            const priority = isGrammar && t.priority;
            return (
              <button key={id} onClick={() => onSelect(t)} style={{
                padding: "8px 14px", borderRadius: 20,
                border: priority ? "1.5px solid #c0392b" : done ? "1.5px solid #27ae60" : "1.5px solid #d4d0ca",
                background: done ? "#e8f5e9" : "#fff", color: "#2c2c2c",
                fontSize: 13, fontFamily: "'DM Sans', sans-serif", cursor: "pointer",
                transition: "all 0.15s ease", opacity: done ? 0.7 : 1,
              }}>
                {done ? "✓ " : ""}{label}
              </button>
            );
          })}
        </div>
      );
    }

    function MessageBubble({ msg }) {
      const isUser = msg.role === "user";
      return (
        <div style={{ display: "flex", justifyContent: isUser ? "flex-end" : "flex-start", marginBottom: 12, animation: "fadeIn 0.3s ease" }}>
          <div style={{
            maxWidth: "85%", padding: "12px 16px",
            borderRadius: isUser ? "18px 18px 4px 18px" : "18px 18px 18px 4px",
            background: isUser ? "#1a3a5c" : "#f0eeea", color: isUser ? "#fff" : "#2c2c2c",
            fontSize: 14, lineHeight: 1.6, fontFamily: "'DM Sans', sans-serif",
            whiteSpace: "pre-wrap", wordBreak: "break-word",
          }}>
            {msg.content}
          </div>
        </div>
      );
    }

    function TypingIndicator() {
      return (
        <div style={{ display: "flex", justifyContent: "flex-start", marginBottom: 12 }}>
          <div style={{ padding: "12px 20px", borderRadius: "18px 18px 18px 4px", background: "#f0eeea", display: "flex", gap: 5, alignItems: "center" }}>
            {[0,1,2].map((i) => (
              <div key={i} style={{ width: 7, height: 7, borderRadius: "50%", background: "#999", animation: `bounce 1.2s ease infinite ${i*0.15}s` }} />
            ))}
          </div>
        </div>
      );
    }

    function ProgressPanel({ progress, onClose }) {
      if (!progress) return null;
      const weakLabels = {
        passive_s: "S-passive", passive_bli: "Bli-passive", passive_faa: "Få-passive",
        conditional: "Conditional", modal_burde_skulle: "Burde/Skulle", modal_kunne: "Kunne",
      };
      return (
        <div style={{ padding: 20, animation: "fadeIn 0.3s ease" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
            <h2 style={{ fontSize: 18, fontFamily: "'DM Serif Display', serif", fontWeight: 400, margin: 0, color: "#2c2c2c" }}>
              📊 Din fremgang
            </h2>
            <button onClick={onClose} style={{ background: "none", border: "none", fontSize: 18, cursor: "pointer" }}>✕</button>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 16 }}>
            {[
              { label: "Level",    value: progress.level || "?" },
              { label: "Sessions", value: progress.sessionsCompleted },
              { label: "Messages", value: progress.totalMessages },
              { label: "Streak",   value: `${progress.streakDays}d 🔥` },
            ].map((s) => (
              <div key={s.label} style={{ background: "#f0eeea", borderRadius: 12, padding: 14, textAlign: "center" }}>
                <div style={{ fontSize: 22, fontWeight: 700, color: "#1a3a5c" }}>{s.value}</div>
                <div style={{ fontSize: 11, color: "#888", marginTop: 2 }}>{s.label}</div>
              </div>
            ))}
          </div>
          <div style={{ background: "#fff5f5", borderRadius: 12, padding: 14, marginBottom: 10 }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: "#c0392b", marginBottom: 6 }}>Focus areas</div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
              {progress.weakAreas.map((w) => (
                <span key={w} style={{ padding: "4px 10px", background: "#fde8e8", borderRadius: 12, fontSize: 12, color: "#c0392b" }}>
                  {weakLabels[w] || w}
                </span>
              ))}
            </div>
          </div>
          {progress.topicsCompleted.length > 0 && (
            <div style={{ background: "#e8f5e9", borderRadius: 12, padding: 14 }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: "#27ae60", marginBottom: 6 }}>Completed topics</div>
              <div style={{ fontSize: 12, color: "#2e7d32" }}>{progress.topicsCompleted.join(", ")}</div>
            </div>
          )}
          <button onClick={async () => {
            if (confirm("Reset all progress? This can't be undone.")) {
              await saveProgress(defaultProgress());
              window.location.reload();
            }
          }} style={{
            marginTop: 16, width: "100%", padding: 10, borderRadius: 10,
            border: "1px solid #ddd", background: "#fff", color: "#999",
            fontSize: 12, cursor: "pointer", fontFamily: "'DM Sans', sans-serif",
          }}>
            Reset all progress
          </button>
        </div>
      );
    }

    // ─── Main App ───
    function NorskTrener() {
      const [apiKey, setApiKey]           = useState(() => localStorage.getItem(API_KEY_KEY) || "");
      const [progress, setProgress]       = useState(null);
      const [initLoading, setInitLoading] = useState(true);
      const [currentMode, setCurrentMode] = useState(null);
      const [currentTopic, setCurrentTopic] = useState(null);
      const [messages, setMessages]       = useState([]);
      const [input, setInput]             = useState("");
      const [sending, setSending]         = useState(false);
      const [showProgress, setShowProgress] = useState(false);
      const [placementStep, setPlacementStep] = useState(0);
      const messagesEndRef = useRef(null);

      useEffect(() => {
        (async () => {
          const saved = await loadProgress();
          setProgress(saved || defaultProgress());
          setInitLoading(false);
        })();
      }, []);

      useEffect(() => {
        if (!progress) return;
        const today = new Date().toISOString().slice(0,10);
        if (progress.lastSessionDate && progress.lastSessionDate !== today) {
          const diff = Math.floor((new Date(today) - new Date(progress.lastSessionDate)) / 86400000);
          if (diff > 1) setProgress((p) => ({ ...p, streakDays: 0 }));
        }
      }, [progress?.lastSessionDate]);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages, sending]);

      useEffect(() => {
        if (progress && !initLoading) saveProgress(progress);
      }, [progress, initLoading]);

      const saveApiKey = (key) => {
        localStorage.setItem(API_KEY_KEY, key);
        setApiKey(key);
      };

      const callClaude = useCallback(async (userMessage, history) => {
        setSending(true);
        try {
          const apiMessages = history
            .filter((m) => m.role === "user" || m.role === "assistant")
            .concat(userMessage ? [{ role: "user", content: userMessage }] : []);

          const response = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-api-key": apiKey,
              "anthropic-version": "2023-06-01",
              "anthropic-dangerous-direct-browser-access": "true",
            },
            body: JSON.stringify({
              model: "claude-sonnet-4-6",
              max_tokens: 1000,
              system: getSystemPrompt(currentMode, currentTopic, progress),
              messages: apiMessages,
            }),
          });
          const data = await response.json();
          if (data.error) return `Error: ${data.error.message}`;
          return data.content?.map((i) => i.type === "text" ? i.text : "").filter(Boolean).join("\n")
            || "Beklager, noe gikk galt. Prøv igjen!";
        } catch (err) {
          console.error("API error:", err);
          return "Beklager, jeg klarte ikke å koble til. Prøv igjen!";
        } finally {
          setSending(false);
        }
      }, [currentMode, currentTopic, progress, apiKey]);

      const startPlacement = useCallback(async () => {
        setCurrentMode("placement");
        setCurrentTopic("Placement Test");
        setMessages([]);
        setPlacementStep(1);
        const reply = await callClaude("Start the placement test.", []);
        setMessages([{ role: "assistant", content: reply }]);
      }, [callClaude]);

      const startSession = useCallback(async (topic) => {
        const topicLabel = typeof topic === "object" ? topic.label : topic;
        setCurrentTopic(topicLabel);
        setMessages([]);

        const prompt = currentMode === "samtale"
          ? `Start conversation scenario: "${topicLabel}". Set the scene and begin.`
          : currentMode === "grammatikk"
          ? `Start grammar drill on: "${topicLabel}". Explain the rule and give the first exercise.`
          : currentMode === "ordforråd"
          ? `Start vocabulary building for: "${topicLabel}". Present the first words.`
          : `Start a Norskprøve B1 practice exercise.`;

        const reply = await callClaude(prompt, []);
        setMessages([{ role: "assistant", content: reply }]);

        const today = new Date().toISOString().slice(0,10);
        setProgress((p) => ({
          ...p,
          sessionsCompleted: p.sessionsCompleted + 1,
          lastSessionDate: today,
          streakDays: p.lastSessionDate === today ? p.streakDays : p.streakDays + 1,
        }));
      }, [currentMode, callClaude]);

      const sendMessage = useCallback(async () => {
        if (!input.trim() || sending) return;
        const userMsg = input.trim();
        setInput("");
        const newMessages = [...messages, { role: "user", content: userMsg }];
        setMessages(newMessages);

        const reply = await callClaude(userMsg, messages);
        setMessages([...newMessages, { role: "assistant", content: reply }]);

        if (currentMode === "placement") {
          const step = placementStep + 1;
          setPlacementStep(step);
          if (step >= 7) {
            const levelMatch = reply.match(/\b(A1|A2|B1|B2)\b/);
            if (levelMatch) setProgress((p) => ({ ...p, level: levelMatch[1], placementDone: true }));
          }
        }
        setProgress((p) => ({ ...p, totalMessages: p.totalMessages + 1 }));
      }, [input, sending, messages, callClaude, currentMode, placementStep]);

      const markTopicDone = useCallback((topicId) => {
        setProgress((p) => ({ ...p, topicsCompleted: [...new Set([...p.topicsCompleted, topicId])] }));
      }, []);

      const resetSession = () => { setCurrentTopic(null); setMessages([]); };
      const resetAll = () => { setCurrentMode(null); setCurrentTopic(null); setMessages([]); setShowProgress(false); };

      if (!apiKey) return <ApiKeySetup onSave={saveApiKey} />;

      if (initLoading) {
        return (
          <div style={{ minHeight: "100vh", background: "#faf9f7", display: "flex", alignItems: "center", justifyContent: "center" }}>
            <div style={{ fontSize: 24 }}>🇳🇴 Loading...</div>
          </div>
        );
      }

      return (
        <div style={{ minHeight: "100vh", background: "#faf9f7", fontFamily: "'DM Sans', sans-serif", display: "flex", flexDirection: "column" }}>
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display&display=swap');
            @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
            @keyframes bounce { 0%,60%,100% { transform:translateY(0); } 30% { transform:translateY(-5px); } }
            input::placeholder { color:#aaa; }
            button:hover { opacity: 0.85; }
          `}</style>

          {/* Header */}
          <div style={{ background: "#1a3a5c", color: "#fff", padding: "20px 20px 16px", position: "sticky", top: 0, zIndex: 10 }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              <div>
                <h1 style={{ margin: 0, fontSize: 22, fontFamily: "'DM Serif Display', serif", fontWeight: 400, letterSpacing: 0.5 }}>
                  🇳🇴 Norsk Trener
                </h1>
                <p style={{ margin: "4px 0 0", fontSize: 12, opacity: 0.7 }}>
                  {progress.level ? `${progress.level} → B1` : "Take placement test"} · Norskprøve prep
                </p>
              </div>
              <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                {progress.streakDays > 0 && (
                  <span style={{ background: "rgba(255,255,255,0.15)", padding: "6px 10px", borderRadius: 20, fontSize: 13 }}>
                    🔥 {progress.streakDays}
                  </span>
                )}
                <button onClick={() => { setShowProgress(!showProgress); if (!showProgress) { setCurrentMode(null); setCurrentTopic(null); } }}
                  style={{ background: "rgba(255,255,255,0.15)", border: "none", borderRadius: "50%", width: 34, height: 34, fontSize: 16, color: "#fff", cursor: "pointer" }}>
                  📊
                </button>
              </div>
            </div>
          </div>

          <div style={{ flex: 1, display: "flex", flexDirection: "column" }}>
            {showProgress && <ProgressPanel progress={progress} onClose={() => setShowProgress(false)} />}

            {!showProgress && !currentMode && (
              <div style={{ padding: 20, animation: "fadeIn 0.4s ease" }}>
                {!progress.placementDone && (
                  <button onClick={startPlacement} style={{
                    width: "100%", padding: 16, borderRadius: 14, border: "2px solid #e67e22",
                    background: "#fef9e7", color: "#2c2c2c", fontSize: 14, fontFamily: "'DM Sans', sans-serif",
                    cursor: "pointer", marginBottom: 16, textAlign: "left", lineHeight: 1.5,
                  }}>
                    <span style={{ fontSize: 18 }}>🧪</span> <strong>Ta plasseringstest</strong><br />
                    <span style={{ fontSize: 12, color: "#888" }}>Find your actual level with a quick 6-question test</span>
                  </button>
                )}

                <h2 style={{ fontSize: 18, fontFamily: "'DM Serif Display', serif", fontWeight: 400, margin: "0 0 4px", color: "#2c2c2c" }}>
                  Hva vil du øve på?
                </h2>
                <p style={{ fontSize: 13, color: "#777", margin: "0 0 16px" }}>What would you like to practice?</p>

                <div style={{ display: "flex", gap: 10 }}>
                  {MODES.map((m) => <ModeCard key={m.id} mode={m} onClick={() => setCurrentMode(m.id)} />)}
                </div>

                {progress.weakAreas.length > 0 && (
                  <div style={{ marginTop: 20, padding: 16, background: "#fff5f5", borderRadius: 12, fontSize: 13, lineHeight: 1.6, color: "#555" }}>
                    <strong style={{ color: "#c0392b" }}>Anbefalt neste steg:</strong><br />
                    Your priority areas are passive voice, conditionals, and modal verbs. Tap Grammatikk and look for the 🔴 topics.
                  </div>
                )}

                <div style={{ marginTop: 12, padding: 16, background: "#f0eeea", borderRadius: 12, fontSize: 13, lineHeight: 1.6, color: "#555" }}>
                  <strong style={{ color: "#2c2c2c" }}>💡 German speaker tip:</strong><br />
                  Norwegian "bli"-passive works like German "werden + Partizip". But s-passive (lukkes, leses) has no German equivalent — extra practice needed!
                </div>
              </div>
            )}

            {!showProgress && currentMode && currentMode !== "placement" && !currentTopic && (
              <div style={{ padding: 20, animation: "fadeIn 0.4s ease" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
                  <button onClick={resetAll} style={{ background: "none", border: "none", fontSize: 18, cursor: "pointer", padding: 4 }}>←</button>
                  <div>
                    <h2 style={{ fontSize: 18, fontFamily: "'DM Serif Display', serif", fontWeight: 400, margin: 0, color: "#2c2c2c" }}>
                      {MODES.find((m) => m.id === currentMode)?.icon} {MODES.find((m) => m.id === currentMode)?.label}
                    </h2>
                    <p style={{ fontSize: 13, color: "#777", margin: "2px 0 0" }}>
                      {currentMode === "grammatikk" ? "🔴 = your priority areas" : currentMode === "norskprøve" ? "Start a test simulation" : "Choose a topic"}
                    </p>
                  </div>
                </div>

                {currentMode === "norskprøve" ? (
                  <button onClick={() => startSession("Norskprøve B1")} style={{
                    width: "100%", padding: "14px 20px", borderRadius: 12, border: "2px solid #1a3a5c",
                    background: "#1a3a5c", color: "#fff", fontSize: 15, fontFamily: "'DM Sans', sans-serif", fontWeight: 600, cursor: "pointer",
                  }}>
                    🎯 Start Norskprøve Practice
                  </button>
                ) : currentMode === "grammatikk" ? (
                  <TopicPicker topics={GRAMMAR_TOPICS} onSelect={startSession} completedTopics={progress.topicsCompleted} />
                ) : currentMode === "samtale" ? (
                  <TopicPicker topics={SAMTALE_SCENARIOS} onSelect={startSession} completedTopics={progress.topicsCompleted} />
                ) : (
                  <TopicPicker topics={VOCAB_TOPICS} onSelect={startSession} completedTopics={progress.topicsCompleted} />
                )}
              </div>
            )}

            {!showProgress && currentTopic && (
              <>
                <div style={{
                  padding: "8px 20px", borderBottom: "1px solid #e8e6e2",
                  display: "flex", alignItems: "center", justifyContent: "space-between", background: "#fff",
                }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <button onClick={resetSession} style={{ background: "none", border: "none", fontSize: 16, cursor: "pointer", padding: 4 }}>←</button>
                    <span style={{ fontSize: 13, color: "#555" }}>
                      {currentMode === "placement" ? "🧪" : MODES.find((m) => m.id === currentMode)?.icon} {currentTopic}
                    </span>
                  </div>
                  <div style={{ display: "flex", gap: 6 }}>
                    {currentMode !== "placement" && (
                      <button onClick={() => markTopicDone(currentTopic)} style={{
                        background: "#e8f5e9", border: "none", borderRadius: 8,
                        padding: "4px 10px", fontSize: 11, color: "#27ae60", cursor: "pointer", fontFamily: "'DM Sans', sans-serif",
                      }}>✓ Done</button>
                    )}
                    <button onClick={resetAll} style={{
                      background: "#f0eeea", border: "none", borderRadius: 8,
                      padding: "4px 10px", fontSize: 11, color: "#777", cursor: "pointer", fontFamily: "'DM Sans', sans-serif",
                    }}>Home</button>
                  </div>
                </div>

                <div style={{ flex: 1, overflowY: "auto", padding: "16px 20px" }}>
                  {messages.map((msg, i) => <MessageBubble key={i} msg={msg} />)}
                  {sending && <TypingIndicator />}
                  <div ref={messagesEndRef} />
                </div>

                <div style={{ padding: "12px 20px 24px", borderTop: "1px solid #e8e6e2", background: "#fff", position: "sticky", bottom: 0 }}>
                  <div style={{ display: "flex", gap: 8 }}>
                    <input
                      value={input}
                      onChange={(e) => setInput(e.target.value)}
                      onKeyDown={(e) => e.key === "Enter" && sendMessage()}
                      placeholder="Skriv på norsk..."
                      disabled={sending}
                      style={{
                        flex: 1, padding: "12px 16px", borderRadius: 24,
                        border: "1.5px solid #d4d0ca", fontSize: 14, fontFamily: "'DM Sans', sans-serif",
                        outline: "none", background: "#faf9f7", transition: "border-color 0.2s",
                      }}
                      onFocus={(e) => (e.target.style.borderColor = "#1a3a5c")}
                      onBlur={(e)  => (e.target.style.borderColor = "#d4d0ca")}
                    />
                    <button onClick={sendMessage} disabled={sending || !input.trim()} style={{
                      width: 44, height: 44, borderRadius: "50%", border: "none",
                      background: input.trim() ? "#1a3a5c" : "#d4d0ca", color: "#fff", fontSize: 18,
                      cursor: input.trim() ? "pointer" : "default", transition: "background 0.2s",
                      display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
                    }}>↑</button>
                  </div>
                </div>
              </>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<NorskTrener />);
  </script>
</body>
</html>
